<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8">
<title>아버지 케어로그 · 메모 단축어 진입 보완</title>
<style>
  body{background:#f7f7f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;padding:28px 18px}
  .notice{max-width:520px;margin:24px auto;padding:20px;background:white;border:1px solid #dde1e6;border-radius:16px}
  h1{font-size:20px;margin:0 0 12px}p{line-height:1.6}button{font:inherit;padding:10px 18px;border-radius:8px;border:0;background:#164bd4;color:white}
  small{color:#667085;line-height:1.5}
</style>
</head>
<body>
<div class="notice" id="load-status">
  <h1>아버지 케어로그</h1>
  <p id="load-message">간병 기록 화면을 여는 중입니다.</p>
  <small>메모 단축어 진입 기능을 적용합니다. 기존 기록은 변경하지 않습니다.</small>
</div>
<script>
/*
 * V44.18-compatible single-file launcher: loads an immutable, verified
 * original GitHub revision, patches it in memory and renders it under the
 * existing GitHub Pages origin. Does not transmit notes to GitHub raw.
 * Keep pinned source immutable to avoid a recursive loader.
 */
(async function bootCarelog(){
  "use strict";
  const pinnedSource = "https://raw.githubusercontent.com/rjw65tk6yw-lgtm/Father-carelog/757d2831ebdf037e91f5be402807adc5312192df/index.html";
  const originalJoin = `function joinFamily(){
  currentAuthor=val("authorName")||"가족"; currentCode=val("familyCode")||"3434";
  if(unsub)unsub();
  unsub=onSnapshot(collection(db,recordsPath()),snap=>{allRows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.dt||"").localeCompare(b.dt||""));scheduleRender();});
  $("roomStatus").textContent=\`입장: \${currentCode} / \${currentAuthor}\`;
  show("input");
}`;
  const betterJoin = `function joinFamily(){
  const requestedAuthor=val("authorName")||"가족";
  const requestedCode=val("familyCode")||"3434";
  // Same room: keep the existing Firestore listener. Do not read it again.
  if(unsub && currentCode===requestedCode){
    currentAuthor=requestedAuthor;
    $("roomStatus").textContent=\`입장: \${currentCode} / \${currentAuthor}\`;
    show("input");
    return;
  }
  currentAuthor=requestedAuthor;
  currentCode=requestedCode;
  if(unsub){unsub();unsub=null;}
  unsub=onSnapshot(collection(db,recordsPath()),snap=>{allRows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.dt||"").localeCompare(b.dt||""));scheduleRender();});
  $("roomStatus").textContent=\`입장: \${currentCode} / \${currentAuthor}\`;
  show("input");
}`;
  const originalTail = 'captureAppleNoteSyncLink();\ncaptureSelectedNoteLink();\n<' + '/script>';
  const betterTail = 'captureAppleNoteSyncLink();\ncaptureSelectedNoteLink();\n' +
    '// iOS Shortcuts may reopen a previously used Safari tab without a page reload.\n' +
    'window.addEventListener("hashchange",captureSelectedNoteLink);\n' +
    'window.addEventListener("pageshow",captureSelectedNoteLink);\n' +
    '<' + '/script>'; 
  function replaceOnce(text,oldText,newText,label){
    if(text.indexOf(oldText)<0 || text.indexOf(oldText, text.indexOf(oldText)+oldText.length)>=0){
      throw new Error(label + ' 수정 위치가 맞지 않습니다. 자동으로 다른 버전을 덮어쓰지 않습니다.');
    }
    return text.replace(oldText,newText);
  }
  try{
    const response=await fetch(pinnedSource,{cache:'force-cache',mode:'cors'});
    if(!response.ok)throw new Error('원본을 열 수 없습니다 (HTTP '+response.status+')');
    let html=await response.text();
    if(html.length<110000||!html.includes('function captureSelectedNoteLink()')||!html.includes('const NOTE_PICKER_URL')){
      throw new Error('V44.18 원본을 확인하지 못했습니다.');
    }
    html=replaceOnce(html,originalJoin,betterJoin,'중복 입장');
    html=replaceOnce(html,originalTail,betterTail,'단축어 메모 화면 이동');
    html=html.replace('<title>아버지 케어로그 V44 · 혈당 기록판</title>','<title>아버지 케어로그 V44.19 · 메모 단축어 보완</title>');
    document.open();document.write(html);document.close();
  }catch(err){
    const text=document.getElementById('load-message');
    if(text)text.textContent='웹앱을 열지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요. ('+(err?.message||String(err))+')';
    const btn=document.createElement('button');btn.textContent='다시 시도';btn.onclick=()=>location.reload();
    document.getElementById('load-status')?.appendChild(btn);
  }
})();
</script>
</body>
</html>
