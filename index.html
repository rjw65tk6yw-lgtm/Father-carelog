<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아버지 케어로그 단순판</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--line:#d9dde3;--text:#111827;--muted:#6b7280;--primary:#2563eb;--danger:#7f1d1d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{position:sticky;top:0;background:#111827;color:#fff;padding:12px 14px;z-index:2}
h1{font-size:19px;margin:0}main{max-width:920px;margin:0 auto;padding:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tabs button{flex:1;min-width:72px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.04)}
h2{font-size:17px;margin:0 0 10px}label{font-size:13px;color:var(--muted);display:block;margin:8px 0 4px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:#fff}
textarea{min-height:96px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:15px}
button.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.note{font-size:13px;color:var(--muted);line-height:1.45}.pill{display:inline-block;background:#eef2ff;border:1px solid #c7d2fe;border-radius:999px;padding:4px 8px;margin:2px;font-size:13px}
.warn{display:inline-block;background:#fee2e2;border:1px solid #fecaca;color:#7f1d1d;border-radius:999px;padding:3px 7px;font-size:12px}
.rec{border-top:1px solid var(--line);padding:10px 0}.rec:first-child{border-top:0}.rec h3{font-size:15px;margin:0 0 6px}.memo{white-space:pre-wrap;color:#374151;font-size:14px;line-height:1.45}
.small{font-size:12px;color:var(--muted)}
@media(max-width:640px){.grid{grid-template-columns:1fr}.tabs button{min-width:48%}}
</style>
</head>
<body>
<header><h1>아버지 케어로그 단순판</h1><div id="roomStatus" class="small">입장 전</div></header>
<main>
<div class="tabs">
<button onclick="show('join')">입장</button>
<button onclick="show('input')">입력</button>
<button onclick="show('records')">기록</button>
<button onclick="show('backup')">백업</button>
</div>

<section id="screen-join">
<div class="card">
<h2>가족 코드 입장</h2>
<label>기록자</label><input id="authorName" placeholder="예: 나 / 엄마 / 큰형">
<label>가족 코드</label><input id="familyCode" placeholder="3434" inputmode="numeric">
<button class="primary" onclick="joinFamily()">입장</button>
</div>
</section>

<section id="screen-input" style="display:none">
<div class="card">
<h2>직접 입력</h2>
<div class="grid">
<div><label>날짜/시간</label><input id="dt" type="datetime-local"></div>
<div><label>기록종류</label><select id="type">
<option>특이사항</option><option>식사/수분</option><option>대소변</option><option>활력징후</option>
<option>네뷸</option><option>토닥이</option><option>석션</option><option>구강청소</option><option>수동적 ROM</option><option>체위변경</option><option>구토</option>
</select></div>
<div><label>SpO₂</label><input id="spo2" type="number"></div><div><label>HR</label><input id="hr" type="number"></div>
<div><label>체온</label><input id="temp" type="number" step="0.1"></div><div><label>산소 L/min</label><input id="oxygen" type="number" step="0.1"></div>
<div><label>체중 kg</label><input id="weight" type="number" step="0.01"></div><div><label>혈압 수축/이완</label><div class="row"><input id="sbp" type="number" placeholder="수축"><input id="dbp" type="number" placeholder="이완"></div></div>
<div><label>식사 mL</label><input id="feed" type="number" step="0.1"></div><div><label>물 mL</label><input id="water" type="number" step="0.1"></div>
<div><label>잔류 mL</label><input id="residual" type="number" step="0.1"></div><div><label>소변 g/mL</label><input id="urine" type="number" step="0.1"></div>
<div><label>대변 g/mL</label><input id="stool" type="number" step="0.1"></div><div><label>HOB</label><input id="hob" type="number"></div>
<div><label>체위</label><input id="position" placeholder="정상위/좌측위/우측위 등"></div>
<div><label>체위 상세</label><select id="positionDetail"><option value=""></option><option>앙와위/Supine</option><option>파울러/Fowler</option><option>측위/Lateral</option><option>복와위/Prone</option><option>심스위/Sims</option><option>트렌델렌버그/Trendelenburg</option><option>역트렌델렌버그/Reverse Trendelenburg</option></select></div>
<div><label>호흡</label><input id="breath" placeholder="그르렁 없음/있음 등"></div>
</div>
<label>메모</label><textarea id="memo"></textarea>
<div id="editStatus" class="note"></div><div class="row"><button class="primary" onclick="saveManual()">저장</button><button onclick="clearInput()">비우기</button><button id="cancelEditBtn" style="display:none" onclick="cancelEdit()">수정 취소</button></div>
</div>

<div class="card">
<h2>로그 붙여넣기</h2>
<div class="note">날짜 헤더 뒤에 시간 기록을 붙여넣으면 자동 분류한다. 메모 안의 예정일·2/2·1/3은 날짜로 보지 않는다.</div>
<textarea id="pasteLog" placeholder="2026.6/16 화 322일차&#10;ㅇ14:30 점심식사 330ml, 물 195ml&#10;- 다음 Na 재검 예정: 26.6/22 월요일"></textarea>
<div class="row"><button onclick="previewPaste()">미리보기</button><button class="primary" onclick="savePaste()">붙여넣기 저장/덮어쓰기</button></div>
<pre id="pastePreview" class="small"></pre>
</div>
</section>

<section id="screen-records" style="display:none">
<div class="card">
<h2>오늘 기록·요약</h2>
<div id="todaySummary"></div>
<div class="row"><button onclick="copyTodaySummary()">요약 복사</button><button onclick="downloadTodaySummaryCsv()">오늘 기록·요약 CSV 저장</button><button onclick="saveTodaySummaryByDate()">오늘 요약 저장/덮어쓰기</button></div>
</div>
<div class="card"><h2>기록</h2><div id="recordsList"></div></div>
</section>

<section id="screen-backup" style="display:none">
<div class="card">
<h2>CSV 편집</h2>
<div class="note">수정용 CSV를 내보내고, 파일에서 행 삭제/수정 후 다시 업로드한다. 행 삭제까지 반영하려면 삭제 포함 버튼을 사용한다.</div>
<label>수정한 CSV 파일</label><input id="csvFile" type="file" accept=".csv,text/csv">
<div class="row">
<button onclick="downloadEditableCsv()">수정용 CSV 내보내기</button>
<button class="primary" onclick="applyCsv(false)">CSV 파일 수정 반영</button>
<button class="danger" onclick="applyCsv(true)">CSV 파일 기준 동기화 / 삭제 포함</button>
</div>
</div>
<div class="card">
<h2>요약 CSV</h2>
<div class="row"><button onclick="downloadDailySummaryCsv()">날짜별 요약 CSV 내보내기</button><button onclick="saveAllDailySummaries()">날짜별 요약 저장/덮어쓰기</button></div>
</div>
<div class="card">
<h2>정리</h2>
<button class="danger" onclick="collapseSameTimeMeals()">같은 시간 식사 중복 정리</button>
</div>
</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCOdone0ckHZmh6sPCYEYgiOupy4qF0yyg",
  authDomain:"father-carelog.firebaseapp.com",
  projectId:"father-carelog",
  storageBucket:"father-carelog.firebasestorage.app",
  messagingSenderId:"1021700026339",
  appId:"1:1021700026339:web:8a01cc13c2317450447ad6",
  measurementId:"G-978SPMWVJ7"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let currentCode="", currentAuthor="", roomPath="", allRows=[], unsub=null, editingId="";

const $=id=>document.getElementById(id);
const val=id=>($(id)?.value||"").trim();
const num=id=>val(id)===""?null:Number(val(id));
const pad=n=>String(n).padStart(2,"0");
const localDate=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowInput=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
$("dt").value=nowInput();

function show(name){
  ["join","input","records","backup"].forEach(s=>$("screen-"+s).style.display=s===name?"block":"none");
  if(name==="records") render();
}
function normalizeYear(y){const n=Number(y);return n<100?2000+n:n}
function dateHeader(line){
  const s=String(line||"").trim();
  let m=s.match(/^(\d{2,4})\s*[.\-/년]\s*(\d{1,2})\s*[.\/월-]\s*(\d{1,2})(?:\s*일)?(?:\s*[월화수목금토일])?(?:\s*\d+일차)?\s*$/);
  if(m){const yy=normalizeYear(m[1]),mm=+m[2],dd=+m[3]; if(mm>=1&&mm<=12&&dd>=1&&dd<=31)return `${yy}-${pad(mm)}-${pad(dd)}`;}
  m=s.match(/^(\d{1,2})\s*[.\/월]\s*(\d{1,2})(?:\s*일)?(?:\s*[월화수목금토일])?(?:\s*\d+일차)?\s*$/);
  if(m){const mm=+m[1],dd=+m[2]; if(mm>=1&&mm<=12&&dd>=1&&dd<=31)return `${new Date().getFullYear()}-${pad(mm)}-${pad(dd)}`;}
  return "";
}
function startsTime(s){return /^[ㅇoO]?\s*\d{1,2}\s*[:시]\s*\d{0,2}/.test(String(s||"").trim())}
function cleanEvent(s){return String(s||"").trim().replace(/^[ㅇoO]\s*/,"").trim()}
function eventTime(s){const m=cleanEvent(s).match(/^(\d{1,2})\s*[:시]\s*(\d{2})?/);return m?`${pad(+m[1])}:${pad(+(m[2]||0))}`:""}
function stripKey(s){return String(s||"").split(/\n/).filter(x=>!/^\s*key\s*:/i.test(x)).join("\n").trim()}
function firstNum(re,s){const m=String(s).match(re);return m?Number(String(m[1]).replace(",",".")):null}

function inferType(s){
  if(/네뷸|nebul/i.test(s))return "네뷸";
  if(/토닥|vest|커프/i.test(s))return "토닥이";
  if(/석션|suction/i.test(s))return "석션";
  if(/구강\s*청소|입안\s*청소|oral|mouth/i.test(s))return "구강청소";
  if(/ROM|관절운동|수동운동|팔\s*운동|다리\s*운동|허리\s*운동/i.test(s))return "수동적 ROM";
  if(/아침식사|점심식사|저녁식사|식사|경관식|피딩|뉴케어|물|수분/.test(s))return "식사/수분";
  if(/소변|대변|변\s*\d/.test(s))return "대소변";
  if(/BP|혈압|SpO|산소포화도|HR|심박|맥박|체온|몸무게|체중|WT/i.test(s))return "활력징후";
  if(/좌측위|우측위|정상위|앙와위|HOB|체위/.test(s))return "체위변경";
  if(/구토/.test(s))return "구토";
  return "특이사항";
}
function actionTypes(s){
  const a=[];
  if(/네뷸|nebul/i.test(s))a.push("네뷸");
  if(/토닥|vest|커프/i.test(s))a.push("토닥이");
  if(/석션|suction/i.test(s))a.push("석션");
  if(/구강\s*청소|입안\s*청소|oral|mouth/i.test(s))a.push("구강청소");
  if(/ROM|관절운동|수동운동|팔\s*운동|다리\s*운동|허리\s*운동/i.test(s))a.push("수동적 ROM");
  return [...new Set(a)];
}
function breathStatus(s){
  const neg=/없음|없다|없고|아직\s*없|없다고|아니오|아님|이상\s*없|특이\s*없/.test(s);
  if(/그르렁|가래\s*소리|가래소리/.test(s))return neg?"그르렁 없음":"그르렁 있음";
  if(/기침/.test(s))return neg?"기침 없음":"기침 있음";
  if(/깊은\s*석션/.test(s))return "깊은 석션 필요";
  if(/불안정|하락|떨어|저하/.test(s)&&/SpO|산소포화도/.test(s))return "SpO₂ 불안정";
  if(/깨끗|양호|이상\s*없|특이\s*없/.test(s))return "깨끗함";
  return "";
}
function warning(r){
  const memo=r.memo||"", b=r.breath||breathStatus(memo);
  if(/없음|없다|아직\s*없|없다고|아니오|아님|이상\s*없|특이\s*없/.test(memo)&&/그르렁|기침|가래/.test(memo))return false;
  return /그르렁 있음|기침 있음|깊은 석션 필요|SpO₂ 불안정/.test(b)||/혈성|피\s*섞|산소포화도.*(하락|저하|떨어)/.test(memo);
}
function safeCalc(expr){
  const s=String(expr||"").replace(/,/g,".").replace(/kg|킬로|체중|몸무게|weight|WT|계산|결과/gi," ").replace(/[^\d+\-*/().\s]/g," ").trim();
  if(!s||!/^[\d+\-*/().\s]+$/.test(s))return null;
  try{const v=Function(`"use strict";return (${s})`)();return Number.isFinite(v)&&v>=20&&v<=200?Math.round(v*100)/100:null}catch(e){return null}
}
function weightFrom(s){
  if(!/(체중|몸무게|weight|WT)/i.test(s))return null;
  if(s.includes("=")){const vals=s.split("=").map(safeCalc).filter(v=>v!==null);if(vals.length)return vals.sort((a,b)=>a-b)[0]}
  const v=safeCalc(s.replace(/.*?(체중|몸무게|weight|WT)/i,"")); if(v!==null)return v;
  return firstNum(/(?:체중|몸무게|weight|WT)\s*[:=]?\s*(\d{2,3}(?:[.,]\d+)?)/i,s);
}
function suctionInfo(s){
  if(!/석션|suction|깊은/i.test(s))return "";
  const arr=[...s.matchAll(/\b([1-9])\s*\/\s*([1-9])\b\s*(깊은)?/g)].map(m=>{
    const near=s.slice(Math.max(0,m.index-10),m.index+25);
    const deep=m[3]||/깊은/.test(near);
    return `${deep?"깊은 ":""}석션 ${m[1]}/${m[2]}`;
  });
  return [...new Set(arr)].join(", ");
}
function annotateSuction(r){
  if(r.type!=="석션")return r;
  const info=suctionInfo(r.memo||"");
  if(info&&!r.memo.includes("[석션횟수:"))r.memo+=`\n[석션횟수: ${info} — 분자=깊은 석션 횟수, 분모=깊은 석션 횟수+얕은 석션 횟수]`;
  return r;
}
function parseLine(text,date){
  const s=cleanEvent(text), t=eventTime(s)||nowInput().slice(11,16);
  const urine=firstNum(/소변[^\d]{0,16}(\d+(?:[.,]\d+)?)/,s);
  let stool=firstNum(/대변[^\d]{0,16}(\d+(?:[.,]\d+)?)/,s);
  if(stool===null)stool=firstNum(/(?:^|[^소대])변[^\d]{0,16}(\d+(?:[.,]\d+)?)/,s);
  let position=""; if(/좌측위/.test(s))position="좌측위";else if(/우측위/.test(s))position="우측위";else if(/정상위|앙와위/.test(s))position="정상위/앙와위";
  const r={dt:`${date}T${t}`,type:inferType(s),spo2:firstNum(/(?:SpO₂|SpO2|spo2|산소포화도)\s*[:=]?\s*(\d{2,3})/i,s),hr:firstNum(/(?:HR|심박수|맥박)\s*[:=]?\s*(\d{2,3})/i,s),temp:firstNum(/(?:체온|T)\s*[:=]?\s*(\d{2}(?:[.,]\d)?)/i,s),oxygen:firstNum(/(?:O₂|O2|산소)\s*[:=]?\s*(\d+(?:[.,]\d)?)\s*L/i,s),weight:weightFrom(s),sbp:null,dbp:null,feed:firstNum(/(?:아침식사|점심식사|저녁식사|식사|경관식|피딩|뉴케어)[^\d]{0,16}(\d+(?:[.,]\d+)?)/,s),water:firstNum(/(?:물|수분)[^\d]{0,16}(?:약\s*)?(\d+(?:[.,]\d+)?)/,s),residual:firstNum(/(?:잔류|위잔류|리거즈|residual)[^\d]{0,12}(\d+(?:[.,]\d+)?)/i,s),urine,stool,hob:firstNum(/HOB\s*[:=]?\s*(\d{1,2})/i,s),position,positionDetail:"",breath:breathStatus(s),memo:s,authorName:currentAuthor||"가족",familyCode:currentCode,updatedAt:serverTimestamp()};
  const bp=s.match(/(?:BP|혈압)?\s*(\d{2,3})\s*\/\s*(\d{2,3})/i); if(bp){r.sbp=+bp[1];r.dbp=+bp[2]}
  return r;
}
function expandRecord(r){
  const acts=actionTypes(r.memo);
  if(acts.length>=2)return acts.map(t=>annotateSuction({...r,type:t,memo:`${r.memo}\n[자동분리: ${t}]`}));
  return [annotateSuction(r)];
}
function isMeal(r){return r.type==="식사/수분"||r.feed!==null||r.water!==null||/(식사|경관식|피딩|뉴케어|물|수분)/.test(r.memo||"")}
function recordId(r){
  const dt=(r.dt||"").slice(0,16);
  if(isMeal(r))return `meal_${dt}`;
  if(["네뷸","토닥이","석션","구강청소","수동적 ROM"].includes(r.type))return `act_${dt}_${r.type}`;
  if(r.urine!==null)return `urine_${dt}_${r.urine}`;
  if(r.stool!==null)return `stool_${dt}_${r.stool}`;
  const base=[dt,r.type,r.spo2??"",r.hr??"",r.temp??"",r.weight??"",stripKey(r.memo)].join("|");
  let h=0;for(let i=0;i<base.length;i++){h=((h<<5)-h)+base.charCodeAt(i);h|=0}
  return "r_"+Math.abs(h).toString(36);
}
function parsePasteText(){
  const lines=val("pasteLog").split(/\n/).map(x=>x.trim()).filter(Boolean);
  let cur=localDate(), pending=null, rows=[];
  const flush=()=>{if(!pending)return; rows.push(...expandRecord(parseLine(pending.text,pending.date))); pending=null};
  for(const line of lines){
    const dh=dateHeader(line);
    if(dh){flush();cur=dh;continue}
    if(startsTime(line)){flush();pending={date:cur,text:cleanEvent(line)};continue}
    if(pending)pending.text+="\n"+line; else pending={date:cur,text:line};
  }
  flush(); return rows;
}
async function saveRows(rows){
  if(!roomPath){alert("먼저 입장하세요.");show("join");return}
  for(const r of rows){const id=recordId(r);await setDoc(doc(db,roomPath,id),{...r,key:id},{merge:false})}
}

function fillInputFromRecord(r){
  $("dt").value=r.dt||nowInput();
  $("type").value=r.type||"특이사항";
  ["spo2","hr","temp","oxygen","weight","sbp","dbp","feed","water","residual","urine","stool","hob"].forEach(k=>$(k).value=(r[k]!==null&&r[k]!==undefined)?r[k]:"");
  $("position").value=r.position||"";
  $("positionDetail").value=r.positionDetail||"";
  $("breath").value=r.breath||"";
  $("memo").value=stripKey(r.memo||"");
}

function editRecord(id){
  const r=allRows.find(x=>x.id===id);
  if(!r){alert("수정할 기록을 찾지 못했습니다.");return;}
  editingId=id;
  fillInputFromRecord(r);
  $("editStatus").textContent=`수정 중: ${r.dt||""} [${r.type||""}]`;
  $("cancelEditBtn").style.display="inline-block";
  show("input");
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
  editingId="";
  $("editStatus").textContent="";
  $("cancelEditBtn").style.display="none";
  clearInput();
}

async function saveManual(){
  const r={dt:val("dt")||nowInput(),type:val("type"),spo2:num("spo2"),hr:num("hr"),temp:num("temp"),oxygen:num("oxygen"),weight:num("weight"),sbp:num("sbp"),dbp:num("dbp"),feed:num("feed"),water:num("water"),residual:num("residual"),urine:num("urine"),stool:num("stool"),hob:num("hob"),position:val("position"),positionDetail:val("positionDetail"),breath:val("breath")||breathStatus(val("memo")),memo:val("memo"),authorName:currentAuthor||"가족",familyCode:currentCode,updatedAt:serverTimestamp()};
  if(!roomPath){alert("먼저 입장하세요.");show("join");return;}
  if(editingId){
    await setDoc(doc(db,roomPath,editingId),{...annotateSuction(r),key:editingId},{merge:false});
    editingId="";
    $("editStatus").textContent="";
    $("cancelEditBtn").style.display="none";
    clearInput();
    alert("수정 저장했습니다.");
    show("records");
    return;
  }
  await saveRows([annotateSuction(r)]);
  clearInput();
  alert("저장했습니다.");
}

function clearInput(){
  ["spo2","hr","temp","oxygen","weight","sbp","dbp","feed","water","residual","urine","stool","hob","position","breath","memo"].forEach(id=>$(id).value="");
  $("positionDetail").value="";
  $("dt").value=nowInput();
}

function previewPaste(){const rows=parsePasteText();$("pastePreview").textContent=rows.map((r,i)=>`${i+1}. ${r.dt} [${r.type}] ${stripKey(r.memo)}`).join("\n\n")}
async function savePaste(){const rows=parsePasteText();if(!rows.length){alert("저장할 기록이 없습니다.");return} if(!confirm(`${rows.length}개 기록을 저장/덮어쓰기 할까요?`))return; await saveRows(rows);$("pasteLog").value="";$("pastePreview").textContent="";alert("저장했습니다.");show("records")}

function joinFamily(){
  currentAuthor=val("authorName")||"가족"; currentCode=val("familyCode")||"3434"; roomPath=`families/${currentCode}/records`;
  if(unsub)unsub();
  unsub=onSnapshot(collection(db,roomPath),snap=>{allRows=snap.docs.map(d=>({id:d.id,...d.data()}));render();});
  $("roomStatus").textContent=`입장: ${currentCode} / ${currentAuthor}`;
  show("input");
}
function todayRows(){const d=localDate();return allRows.filter(r=>(r.dt||"").slice(0,10)===d).sort((a,b)=>(a.dt||"").localeCompare(b.dt||""))}
function sum(rows,k){return rows.reduce((a,r)=>a+(Number(r[k])||0),0)}
function count(rows,t){return rows.filter(r=>r.type===t).length}
function summaryObj(date,rows){
  const latestW=(rows.filter(r=>r.weight!==null&&r.weight!==undefined&&r.weight!=="").sort((a,b)=>(a.dt||"").localeCompare(b.dt||"")).pop()||{}).weight??"";
  const text=[`${date} 요약`,`기록 ${rows.length}개`,`식사 ${sum(rows,"feed")}mL / 물 ${sum(rows,"water")}mL`,`소변 ${sum(rows,"urine")} / 대변 ${sum(rows,"stool")}`,`네뷸 ${count(rows,"네뷸")}회 / 토닥이 ${count(rows,"토닥이")}회 / 석션 ${count(rows,"석션")}회 / 구강청소 ${count(rows,"구강청소")}회 / ROM ${count(rows,"수동적 ROM")}회`,latestW?`체중 ${latestW}kg`:""].filter(Boolean).join("\n");
  return {날짜:date,기록수:rows.length,식사:sum(rows,"feed"),물:sum(rows,"water"),소변:sum(rows,"urine"),대변:sum(rows,"stool"),네뷸:count(rows,"네뷸"),토닥이:count(rows,"토닥이"),석션:count(rows,"석션"),구강청소:count(rows,"구강청소"),수동적ROM:count(rows,"수동적 ROM"),체중:latestW,요약:text};
}
function render(){
  const today=todayRows(), obj=summaryObj(localDate(),today);
  $("todaySummary").innerHTML=Object.entries(obj).filter(([k])=>k!=="요약").map(([k,v])=>`<span class="pill">${k}: ${v}</span>`).join("")+`<pre class="small">${obj.요약}</pre>`;
  const rows=allRows.slice().sort((a,b)=>(b.dt||"").localeCompare(a.dt||""));
  $("recordsList").innerHTML=rows.map(r=>`<div class="rec"><h3>${r.dt||""} [${r.type||""}] ${warning(r)?'<span class="warn">주의</span>':""}</h3><div class="small">${detail(r)}</div><div class="memo">${escapeHtml(stripKey(r.memo||""))}</div><button onclick="editRecord('${r.id}')">수정</button> <button class="danger" onclick="deleteRecord('${r.id}')">삭제</button></div>`).join("")||"<div class='note'>기록 없음</div>";
}
function detail(r){const a=[];["spo2","hr","temp","oxygen","weight","feed","water","residual","urine","stool","hob"].forEach(k=>{if(r[k]!==null&&r[k]!==undefined&&r[k]!=="")a.push(`${k}:${r[k]}`)}); if(r.sbp)a.push(`BP:${r.sbp}/${r.dbp||""}`); if(r.position)a.push(r.position); if(r.breath)a.push(r.breath); return a.join(" / ")}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function deleteRecord(id){if(!confirm("이 기록을 삭제할까요?"))return;await deleteDoc(doc(db,roomPath,id))}
async function copyTodaySummary(){await navigator.clipboard.writeText(summaryObj(localDate(),todayRows()).요약);alert("복사했습니다.")}

function csvEsc(v){const s=String(v??"");return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function download(name,text){const a=document.createElement("a"),blob=new Blob([text],{type:"text/csv;charset=utf-8"});a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
const csvHeaders=["id","날짜시간","기록종류","SpO2","HR","체온","산소","체중","혈압수축","혈압이완","식사","물","잔류","소변","대변","HOB","체위","체위상세","호흡","메모"];
function rowToCsv(r){return [r.id||recordId(r),r.dt||"",r.type||"",r.spo2??"",r.hr??"",r.temp??"",r.oxygen??"",r.weight??"",r.sbp??"",r.dbp??"",r.feed??"",r.water??"",r.residual??"",r.urine??"",r.stool??"",r.hob??"",r.position||"",r.positionDetail||"",r.breath||"",stripKey(r.memo||"")]}
function downloadEditableCsv(){download(`아버지_케어로그_수정용_${localDate()}.csv`,"\ufeff"+[csvHeaders,...allRows.map(rowToCsv)].map(r=>r.map(csvEsc).join(",")).join("\n"))}
function parseCsv(text){const rows=[];let row=[],f="",q=false;text=String(text||"");for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q){if(c=='"'&&n=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else{if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"){row.push(f);rows.push(row);row=[];f=""}else if(c!="\r")f+=c}}row.push(f);rows.push(row);return rows.filter(r=>r.some(x=>String(x).trim()))}
function csvNum(v){const s=String(v??"").trim();if(!s)return null;const n=Number(s.replace(",","."));return Number.isFinite(n)?n:null}
function csvRecord(o){return {dt:o["날짜시간"]||"",type:o["기록종류"]||"특이사항",spo2:csvNum(o["SpO2"]),hr:csvNum(o["HR"]),temp:csvNum(o["체온"]),oxygen:csvNum(o["산소"]),weight:csvNum(o["체중"]),sbp:csvNum(o["혈압수축"]),dbp:csvNum(o["혈압이완"]),feed:csvNum(o["식사"]),water:csvNum(o["물"]),residual:csvNum(o["잔류"]),urine:csvNum(o["소변"]),stool:csvNum(o["대변"]),hob:csvNum(o["HOB"]),position:o["체위"]||"",positionDetail:o["체위상세"]||"",breath:o["호흡"]||"",memo:stripKey(o["메모"]||""),authorName:currentAuthor||"가족",familyCode:currentCode,updatedAt:serverTimestamp()}}
async function readCsvFile(){const f=$("csvFile").files[0];if(!f)throw new Error("CSV 파일을 선택하세요.");return await f.text()}
async function applyCsv(deleteMissing){
  if(!roomPath){alert("먼저 입장하세요.");return}
  let text;try{text=await readCsvFile()}catch(e){alert(e.message);return}
  const rows=parseCsv(text), heads=rows[0].map(h=>String(h).replace(/^\ufeff/,"").trim()), data=rows.slice(1).map(r=>{const o={};heads.forEach((h,i)=>o[h]=r[i]??"");return o});
  const ids=new Set(); if(!confirm(`${data.length}개 반영${deleteMissing?" 및 삭제 동기화":""}할까요?`))return;
  for(const o of data){const r=csvRecord(o),id=(o.id||o.ID||"").trim()||recordId(r);ids.add(id);await setDoc(doc(db,roomPath,id),{...r,key:id},{merge:false})}
  if(deleteMissing){for(const r of allRows){const id=r.id||recordId(r);if(!ids.has(id))await deleteDoc(doc(db,roomPath,id))}}
  $("csvFile").value=""; alert("완료했습니다.");
}
function summaryCsv(rows){const h=["날짜","기록수","식사","물","소변","대변","네뷸","토닥이","석션","구강청소","수동적ROM","체중","요약"];return "\ufeff"+[h,...rows.map(o=>h.map(k=>o[k]??""))].map(r=>r.map(csvEsc).join(",")).join("\n")}
function byDate(){const m={};for(const r of allRows){const d=(r.dt||"").slice(0,10);if(d)(m[d]||=[]).push(r)}return Object.keys(m).sort().map(d=>summaryObj(d,m[d]))}
function downloadDailySummaryCsv(){download(`아버지_케어로그_날짜별요약_${localDate()}.csv`,summaryCsv(byDate()))}
function downloadTodaySummaryCsv(){download(`아버지_케어로그_오늘요약_${localDate()}.csv`,summaryCsv([summaryObj(localDate(),todayRows())]))}
async function saveTodaySummaryByDate(){const d=localDate();await setDoc(doc(db,`families/${currentCode}/dailySummaries`,d),{...summaryObj(d,todayRows()),updatedAt:serverTimestamp()},{merge:false});alert("저장했습니다.")}
async function saveAllDailySummaries(){for(const o of byDate())await setDoc(doc(db,`families/${currentCode}/dailySummaries`,o.날짜),{...o,updatedAt:serverTimestamp()},{merge:false});alert("저장했습니다.")}
async function collapseSameTimeMeals(){const groups={};for(const r of allRows){if(isMeal(r))(groups[recordId(r)]||=[]).push(r)};let del=0;for(const [id,arr] of Object.entries(groups)){if(arr.length>1){const keep=arr[arr.length-1];await setDoc(doc(db,roomPath,id),{...keep,key:id},{merge:false});for(const r of arr){if(r.id&&r.id!==id){await deleteDoc(doc(db,roomPath,r.id));del++}}}}alert(`정리 완료: ${del}개 삭제`)}

Object.assign(window,{show,joinFamily,saveManual,clearInput,editRecord,cancelEdit,previewPaste,savePaste,deleteRecord,copyTodaySummary,downloadTodaySummaryCsv,saveTodaySummaryByDate,downloadEditableCsv,applyCsv,downloadDailySummaryCsv,saveAllDailySummaries,collapseSameTimeMeals});
</script>
