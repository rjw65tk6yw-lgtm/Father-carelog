<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>아버지 케어로그</title>
  <meta name="theme-color" content="#1f5fbf" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app" class="app">
    <header class="app-header">
      <div>
        <h1>아버지 케어로그</h1>
        <p id="todayLabel" class="subtle"></p>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙️</button>
    </header>

    <main>
      <section id="view-home" class="view active" aria-labelledby="home-title">
        <h2 id="home-title" class="sr-only">홈</h2>
        <article class="card summary-card">
          <div class="card-head">
            <h3>오늘 요약</h3>
            <button class="text-btn" data-go="summary">더보기 ›</button>
          </div>
          <div id="homeSummary" class="metric-row"></div>
        </article>

        <section class="quick-grid" aria-label="빠른 이동">
          <button class="quick-card primary" data-go="entry"><span>＋</span><b>기록 추가</b></button>
          <button class="quick-card" data-go="summary"><span>📋</span><b>오늘 요약</b></button>
          <button class="quick-card" data-go="backup"><span>☁️</span><b>백업/복원</b></button>
          <button class="quick-card" data-go="recent"><span>🕘</span><b>최근 기록</b></button>
        </section>

        <article class="card warn-card">
          <h3>주의사항 / 확인할 점</h3>
          <ul id="attentionList"></ul>
        </article>
      </section>

      <section id="view-entry" class="view" aria-labelledby="entry-title">
        <div class="view-title"><button class="back-btn" data-go="home">‹</button><h2 id="entry-title">기록 추가</h2></div>
        <form id="entryForm" class="card form-card">
          <label>시간
            <input id="entryTime" type="datetime-local" required />
          </label>

          <fieldset>
            <legend>카테고리</legend>
            <div id="categoryChips" class="chip-grid"></div>
          </fieldset>

          <div class="amount-row">
            <label>양
              <input id="amount" type="number" inputmode="decimal" min="0" step="0.1" placeholder="예) 330" />
            </label>
            <label>단위
              <select id="unit">
                <option>mL</option>
                <option>g</option>
                <option>회</option>
                <option>kcal</option>
              </select>
            </label>
          </div>

          <label id="kcalWrap">kcal
            <input id="kcal" type="number" inputmode="numeric" min="0" step="1" placeholder="예) 400" />
          </label>

          <label>메모
            <textarea id="memo" rows="4" placeholder="예) 좌측위 HOB40, 기침 없음, SpO₂ 96"></textarea>
          </label>

          <button class="save-btn" type="submit">저장</button>
        </form>
      </section>

      <section id="view-summary" class="view" aria-labelledby="summary-title">
        <div class="view-title"><button class="back-btn" data-go="home">‹</button><h2 id="summary-title">오늘 요약</h2></div>
        <div id="summaryMetrics" class="summary-grid"></div>
        <article class="card">
          <h3>주요 변화</h3>
          <ul id="changeList"></ul>
        </article>
        <article class="card">
          <h3>직원에게 전달할 내용</h3>
          <ul id="handoffList"></ul>
        </article>
        <article class="card">
          <div class="card-head"><h3>최근 기록</h3><button class="text-btn" data-go="recent">더보기 ›</button></div>
          <div id="summaryRecent" class="log-list compact"></div>
        </article>
      </section>

      <section id="view-backup" class="view" aria-labelledby="backup-title">
        <div class="view-title"><button class="back-btn" data-go="home">‹</button><h2 id="backup-title">백업 / 복원</h2></div>
        <div class="backup-list">
          <button id="exportCsv" class="backup-card"><span class="file green">CSV</span><b>CSV 내보내기</b><small>전체 기록을 CSV 파일로 저장</small></button>
          <label class="backup-card file-label"><span class="file blue">CSV</span><b>CSV 가져오기</b><small>CSV 파일을 선택하여 복원</small><input id="importCsv" type="file" accept=".csv,text/csv" hidden /></label>
          <button id="exportJson" class="backup-card"><span class="file purple">JSON</span><b>JSON 백업</b><small>앱 데이터 백업 파일 생성</small></button>
          <button id="saveDaySummary" class="backup-card"><span class="file orange">요약</span><b>날짜별 요약 저장</b><small>오늘 요약을 텍스트 파일로 저장</small></button>
        </div>
        <article id="backupStatus" class="card success-card hidden"></article>
        <p class="safe-note">🛡️ 백업 파일은 기기에 저장됩니다. 중요한 데이터는 주기적으로 백업하세요.</p>
      </section>

      <section id="view-recent" class="view" aria-labelledby="recent-title">
        <div class="view-title"><button class="back-btn" data-go="home">‹</button><h2 id="recent-title">최근 기록</h2></div>
        <div class="card filter-card">
          <label>날짜 선택
            <input id="filterDate" type="date" />
          </label>
          <button id="clearFilter" class="secondary-btn">오늘로 이동</button>
        </div>
        <div id="recentList" class="log-list"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="하단 메뉴">
      <button class="nav-btn active" data-go="home">⌂<span>홈</span></button>
      <button class="nav-btn" data-go="entry">▤<span>기록</span></button>
      <button class="nav-btn" data-go="summary">▣<span>요약</span></button>
      <button class="nav-btn" data-go="backup">⚙<span>백업</span></button>
    </nav>
  </div>

  <script src="script.js"></script>
</body>
</html>
